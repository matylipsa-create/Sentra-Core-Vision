name: Build Sentra Vision PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build PWA
        run: npm run build

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentra-vision-pwa
          path: dist/
          if-no-files-found: error
